; PN532 V3 (Elechouse) + NodeMCU ESP8266 (default) or ESP32-C3 SuperMini.
; Read/write NFC tags, clone snapshots, web UI.

[platformio]
default_envs = nodemcuv2

[env]
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_flags = -DCORE_DEBUG_LEVEL=2

lib_deps =
    adafruit/Adafruit PN532@^1.3.4
    bblanchon/ArduinoJson@^7.2.1
    links2004/WebSockets@^2.6.1

; NodeMCU 1.0 / ESP-12E, 4 MB flash: 3 MB code + 1 MB LittleFS (default ldscript).
[env:nodemcuv2]
platform = espressif8266@4.2.1
board = nodemcuv2
upload_speed = 460800

; Alternate target, kept working.
[env:esp32c3]
platform = espressif32@6.10.0
board = esp32-c3-devkitm-1
upload_speed = 921600
; 3 MB app + ~900 KB filesystem, no OTA partitions (single-slot build).
board_build.partitions = huge_app.csv
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=2
